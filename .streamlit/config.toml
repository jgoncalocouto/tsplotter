[server]
# Per-file upload limit (MB)
maxUploadSize = 2048     # 2 GB
# Max WebSocket message size (MB) – affects large charts/dataframes/transfers
maxMessageSize = 2048

[theme]
base = "light"
primaryColor = "#6251c6"
backgroundColor = "#f7f8fc"
secondaryBackgroundColor = "#f0f2f8"
textColor = "#20273d"
font = "sans serif"

[browser]
gatherUsageStats = false
